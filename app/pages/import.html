<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Import · META-MD (local)</title>
    <meta name="description" content="Import des pages d'un site dans le corpus.">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        connect-src 'self';
        img-src 'self' data:;
        form-action 'self';
    ">
    <link rel="icon" type="image/png" href="assets/meta-md-16x16.png">
    <link rel="apple-touch-icon" href="assets/meta-md-16x16.png">
    <link rel="stylesheet" href="assets/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="subpage" data-page="import">

<header id="app-header">
    <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/meta-md-64x80.png" alt="META-MD" width="32" height="32">
    </a>
</header>

<main id="app-main">

    <div class="page-head">
        <a class="btn ghost btn-back" id="import-back-link" href="corpus.html" title="Retour au corpus" aria-label="Retour au corpus"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>
        <h1 class="page-title">Import : <span id="import-theme-name">…</span></h1>
    </div>

    <section id="import-block" class="tips-section">

        <section class="rag-block hidden" id="message-block-local">
            <strong data-bind="message-title">-</strong>
            <p data-bind="message-text">-</p>
        </section>

        <p class="step-warning hidden" id="import-schema-lock"></p>

        <div id="import-summary"></div>

        <div class="extraction-bulk-bar hidden" id="import-bulk-bar">
            <div class="bulk-row">
                <label class="checkbox-inline">
                    <input type="checkbox" id="import-select-all">
                    <span>Tout sélectionner</span>
                </label>
                <label class="checkbox-inline">
                    <input type="checkbox" id="import-only-proposed" checked>
                    <span>Seulement les pages du site</span>
                </label>
                <button type="button" class="btn primary" id="btn-import-selected" disabled>
                    <i class="fa-solid fa-file-import"></i> Importer la sélection
                </button>
            </div>
            <div class="bulk-row bulk-row-indent">
                <span class="extraction-bulk-summary muted small" id="import-bulk-summary">Aucune page sélectionnée.</span>
            </div>
        </div>

        <div id="import-list">
            <p class="muted small"><span class="spinner"></span>Chargement…</p>
        </div>
    </section>

</main>

<script src="assets/marked.js" defer></script>
<script src="assets/app.js" defer></script>
</body>
</html>
